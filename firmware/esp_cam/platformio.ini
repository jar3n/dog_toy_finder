; PlatformIO project for the Dog Toy Finder stereo-vision ESP32-CAM modules.
; Each board is built with a different environment so the same source produces
; a "left" and a "right" camera without editing the sketch.

[platformio]
src_dir = .
default_envs = esp32cam_left

[env:esp32cam_left]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam            ; AI Thinker ESP32-CAM (enables its 4 MB PSRAM)
framework = arduino
build_src_filter = +<*> -<.pio/> -<.vscode/>
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags = -DCAMERA_SIDE=\"left\"

[env:esp32cam_right]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam
framework = arduino
build_src_filter = +<*> -<.pio/> -<.vscode/>
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags = -DCAMERA_SIDE=\"right\"

; The sketch also opens in the Arduino IDE with the board "AI Thinker ESP32-CAM".
; In that case set the CAMERA_SIDE macro at the top of the .ino by hand.
