# robot_localization EKF for the Dog Toy Finder: wheel odometry + BNO055 IMU.
#
# Each *_config list selects which values of a message the filter uses, in this
# order:
#   [ x,     y,      z,
#     roll,  pitch,  yaw,
#     vx,    vy,     vz,
#     vroll, vpitch, vyaw,
#     ax,    ay,     az ]
ekf_filter_node:
  ros__parameters:
    frequency: 50.0              # Hz, matches the 50 Hz Pico publishers
    sensor_timeout: 0.1          # s without data before predicting only
    two_d_mode: true             # flat floor: ignore z, roll, pitch
    publish_tf: true             # the EKF owns odom -> base_link
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom            # smooth local frame; no map/GPS needed

    # Wheels: forward speed and turn rate. Do not fuse wheel pose: it drifts and
    # is computed from the same encoder positions, so it would be counted twice.
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # BNO055: heading from its quaternion and turn rate from its gyroscope.
    # The firmware publishes sensor_msgs/Imu on /imu/data in frame imu_link.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: true          # first IMU heading becomes 0, like the wheels
    imu0_remove_gravitational_acceleration: false   # BNO055 already removes it
