# Settings for the rectified stereo vision stack. The path to this file is set
# in scripts/full_system_eval.conf as VISION_DETECTOR_CONFIG and forwarded to
# the capture/eval tools and stereo_vision.launch.py.
#
# Both pipelines take the operator's text target plus the rectified left/right
# JPEGs and return the object's location. An explicit `pipeline:=` launch arg,
# --pipeline on vision_eval, or VISION_PIPELINE overrides the choice below.
#
# The camera values must match the calibrated intrinsics passed to
# stereo_vision.launch.py. They are used for stereo triangulation and for the
# shared numeric bearing convention atan((cx - u) / fx), positive to the left.

pipeline: open_vocab   # open_vocab | stereo-net (dense-stereo depth)

camera:
  width: 320
  height: 240
  fx: 250.0
  fy: 250.0
  cx: 160.0
  cy: 120.0
  baseline_m: 0.08
  depth_min_m: 0.25
  depth_max_m: 3.0
  left_rectified_topic: /stereo/left/image_rect_color
  right_rectified_topic: /stereo/right/image_rect_color

# Real-world toy measurements. Measure these with a ruler for your actual toy.
target:
  known_width_m: 0.075
  known_height_m: 0.075

# open_vocab: an open-vocabulary detector runs on the computer as an HTTP
# service (scripts/start_yolo_service.sh); this container only sends JPEGs and
# matches the returned detections. One detector runs at a time: yolo_world,
# yoloe_26, or grounding_dino. The backend and weights are configured on the
# host via DETECTOR_MODEL and YOLO_MODEL_PATH / YOLOE_MODEL_PATH /
# GROUNDING_DINO_MODEL (plus YOLO_DEVICE), not here.
open_vocab:
  name: yolov8s-world            # fallback model name; the service may report its own
  service_url: http://localhost:5006
  timeout_s: 60
  confidence_threshold: 0.25
  max_detections: 10
  min_disparity: 3
  max_disparity: 96
  max_vertical_delta_px: 20

# stereo-net: the detector above runs on the left image only; a host dense-stereo
# service (scripts/start_stereo_service.sh) reads depth from a disparity map.
# One depth model runs at a time, selected on the host with DEPTH_MODEL:
#   lite_any_stereo | fast_foundation_stereo | rt_igevpp
# The model/weights/device are configured on the host, not here. `name` below
# is only the fallback recorded when the service does not report a name.
stereo-net:
  name: lite_any_stereo
  service_url: http://localhost:5007
  timeout_s: 180
  window_radius_px: 3       # box-only detectors: median over (2r+1)^2 pixels
  max_disparity: 192        # upper bound on dense disparity samples
