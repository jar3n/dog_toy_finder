# Settings for the rectified stereo vision stack. The path to this file is set
# in scripts/full_system_eval.conf as VISION_DETECTOR_CONFIG and forwarded to
# the capture/eval tools and stereo_vision.launch.py.
#
# Both pipelines take the operator's text target plus the rectified left/right
# JPEGs and return the object's location. An explicit `pipeline:=` launch arg,
# --pipeline on vision_eval, or VISION_PIPELINE overrides the choice below.
#
# The camera values must match the calibrated intrinsics passed to
# stereo_vision.launch.py. They are used for stereo triangulation and for the
# shared numeric bearing convention atan((cx - u) / fx), positive to the left.

pipeline: open_vocab   # open_vocab | second (reserved, not configured yet)

camera:
  width: 320
  height: 240
  fx: 250.0
  fy: 250.0
  cx: 160.0
  cy: 120.0
  baseline_m: 0.08
  depth_min_m: 0.25
  depth_max_m: 3.0
  left_rectified_topic: /stereo/left/image_rect_color
  right_rectified_topic: /stereo/right/image_rect_color

# Real-world toy measurements. Measure these with a ruler for your actual toy.
# The position_* fields only derive the legacy left/center/right label from the
# numeric bearing; they do not affect triangulation.
target:
  known_width_m: 0.075
  known_height_m: 0.075
  position_split_left: 0.333
  position_split_right: 0.667
  # Fallback bearing (degrees) when an older answer has only the legacy
  # left/center/right label and no lateral_bearing_deg field.
  position_bearing_deg: 15.0

# open_vocab: the YOLO-world detector runs on the computer as an HTTP service
# (scripts/start_yolo_service.sh); this container only sends JPEGs and matches
# the returned detections. Weight path and torch device are configured on the
# host service via YOLO_MODEL_PATH / --device, not here.
open_vocab:
  name: yolov8s-world            # fallback model name; the service may report its own
  service_url: http://localhost:5006
  timeout_s: 60
  confidence_threshold: 0.25
  max_detections: 10
  min_disparity: 3
  max_disparity: 96
  max_vertical_delta_px: 20
