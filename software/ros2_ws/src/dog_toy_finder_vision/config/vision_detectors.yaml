# Physical measurements for the Ollama vision models. The path to this file is
# set in scripts/full_system_eval.conf as VISION_DETECTOR_CONFIG and forwarded
# to the capture/eval tools and stereo_vision.launch.py.
#
# The camera values must match the calibrated intrinsics passed to
# stereo_vision.launch.py. They are included in the model prompt so the model
# can judge depth and lateral bearing from the rectified pair.
camera:
  width: 320
  height: 240
  fx: 250.0
  fy: 250.0
  cx: 160.0
  cy: 120.0
  baseline_m: 0.08
  depth_min_m: 0.25
  depth_max_m: 3.0
  left_rectified_topic: /stereo/left/image_rect_color
  right_rectified_topic: /stereo/right/image_rect_color

# Real-world toy measurements included in the model prompt. Measure these with
# a ruler for your actual toy. The position_* fields are only used to derive
# the legacy left/center/right label from a numeric bearing.
target:
  known_width_m: 0.075
  known_height_m: 0.075
  position_split_left: 0.333
  position_split_right: 0.667
  # Fallback bearing (degrees) when an older answer has only the legacy
  # left/center/right label and no lateral_bearing_deg field.
  position_bearing_deg: 15.0

# Ollama vision models receive the same rectified images and this physical
# measurement summary. Set VISION_MODELS in
# scripts/full_system_eval.conf to compare several models; models are loaded
# and unloaded one at a time.
ml:
  enabled: true
  include_physical_summary: true
