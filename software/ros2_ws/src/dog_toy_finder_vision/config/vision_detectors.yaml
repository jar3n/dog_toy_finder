# Settings for the rectified stereo vision stack. The path to this file is set
# in scripts/full_system_eval.conf as VISION_DETECTOR_CONFIG and forwarded to
# the capture/eval tools and stereo_vision.launch.py.
#
# Both pipelines take the operator's text target plus the rectified left/right
# JPEGs and return the object's location. An explicit `pipeline:=` launch arg or
# VISION_PIPELINE overrides the choice below for the live node. Offline
# vision_eval runs the full model matrix by default; use --pipeline NAME and the
# repeatable --detector/--depth-model flags to select a subset.
#
# The per-eye camera values must match the rectified intrinsics passed to
# stereo_vision.launch.py. Detection and triangulation use the left eye; the
# right eye is kept separate so the camera node does not force a shared K.
# Bearing uses atan((left.cx - u) / left.fx), positive to the left.

# Live vision pipeline used when no explicit selector is given (vision_eval
# ignores this default and sweeps all models unless filters are passed):
#   triangulation - detect in both eyes, triangulate distance from disparity
#   stereo-net  - detect in the left eye, read dense-stereo depth
pipeline: triangulation

camera:
  # Rectified image size in pixels. Must match the launch width/height and the
  # calibration that produced the two eyes' fx, fy, cx, and cy.
  width: 320
  height: 240

  # Separation of the two optical centres in metres. This is the norm of the
  # solved translation vector, so it matches the P2 x-translation below.
  baseline_m: 0.0496

  # Rectified intrinsics from stereoRectify's P1 and P2. These are the 3x3
  # intrinsics of the images sent to the detectors, not the raw K1/K2 saved in
  # stereo_calibration.json. Keeping the two eyes separate preserves the
  # measured principal-point offset; without a calibration file the node
  # publishes these values with identity rectification.
  left:
    # left.fx drives triangulation and lateral bearing; disparity is
    # (u_left - u_right) - (left.cx - right.cx), so distance is
    # left.fx * baseline_m / disparity. Bearing = atan((left.cx - u) / left.fx),
    # positive to robot-left.
    fx: 346.89
    fy: 346.89
    cx: 165.98
    cy: 121.07

  right:
    fx: 346.89
    fy: 346.89
    cx: 136.94
    cy: 121.07

  # Accepted depth window in metres. Matches outside this range are reported as
  # not visible instead of producing a distance.
  depth_min_m: 0.25
  depth_max_m: 2.0

  # Rectified colour image topics consumed by vision_node and vision_capture.
  # vision_node's left_rect_topic/right_rect_topic parameters can override them.
  left_rectified_topic: /stereo/left/image_rect_color
  right_rectified_topic: /stereo/right/image_rect_color

# open_vocab: an open-vocabulary detector runs on the computer as an HTTP
# service (scripts/start_yolo_service.sh); this container only sends JPEGs and
# matches the returned detections. One detector runs at a time: yolo_world,
# yoloe_26, or grounding_dino. The host service starts without a model; the ROS
# client sends this `detector` choice to POST /configure when it starts. Change
# it here to switch backends; the host start script prepares all three.
open_vocab:
  # Host detector backend selected by POST /configure. Known weights stems are
  # also accepted, e.g. yolov8s-world, yoloe-26s-seg, grounding-dino-tiny.
  detector: yolo_world

  # Model name recorded in results. The service reports its own name, so this is
  # only a fallback; update it when switching to a different backend.
  name: yolov8s-world

  # Base URL of the host detector service. Overridden by YOLO_SERVICE_URL in the
  # container or the launch argument yolo_service_url.
  service_url: http://localhost:5006

  # HTTP timeout in seconds for each /detect request.
  timeout_s: 60

  # Sent to the host detector: minimum confidence and maximum detections per
  # image. Lower confidence increases recall but also false matches.
  confidence_threshold: 0.25
  max_detections: 10

  # Stereo matching bounds in pixels for paired left/right detections. A pair is
  # accepted when min_disparity <= disparity <= max_disparity, where disparity
  # is (u_left - u_right) - (left.cx - right.cx). The principal-point offset is
  # subtracted before distance = left.fx * baseline_m / disparity.
  min_disparity: 3
  max_disparity: 96

  # Reject a left/right detection pair when its row (v) coordinates differ by
  # more than this many pixels.
  max_vertical_delta_px: 20

# stereo-net: the detector above runs on the left image only; a host dense-stereo
# service (scripts/start_stereo_service.sh) reads depth from a disparity map.
# One depth model runs at a time. The host service starts without a model; the
# ROS client sends this `model` choice to POST /configure when it runs the
# stereo-net pipeline. The host start script prepares all three repositories and
# checkpoints, so no DEPTH_MODEL variable is needed.
stereo-net:
  # Host dense-stereo backend selected by POST /configure:
  #   lite_any_stereo | fast_foundation_stereo | rt_igevpp
  model: lite_any_stereo

  # Fallback depth model name recorded when the service omits one.
  name: lite_any_stereo

  # Base URL of the host depth service. Overridden by STEREO_SERVICE_URL in the
  # container or the launch argument stereo_service_url.
  service_url: http://localhost:5007

  # HTTP timeout in seconds for each /depth request; model inference can be slow.
  timeout_s: 180

  # For box-only detectors, radius in pixels of the square box-centre window
  # whose disparity samples are medianed: (2 * radius + 1)^2 pixels. YOLOE-26
  # instead uses all pixels of the detected instance mask.
  window_radius_px: 3

  # Upper bound in pixels passed to the dense-stereo service when sampling
  # disparity; larger values allow nearer objects but cost more computation.
  max_disparity: 192
