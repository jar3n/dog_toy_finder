# Run from the docker/ folder:  docker compose build   |   docker compose run --rm ros2
# The whole repo is mounted at /workspace in every container. HOST_UID/HOST_GID
# default to 1000:1000; override them in the shell or a local .env if the host
# account uses different IDs. Files written into /workspace then stay owned by
# the host user instead of root.
services:
  # micro-ROS agent for the Pico's Wi-Fi/UDP link. The ROS 2 image does not
  # include this package, so it runs as its own container. Host networking lets
  # the Pico reach UDP port 8888 on the computer directly.
  micro_ros_agent:
    image: microros/micro-ros-agent:humble
    container_name: micro-ros-agent
    network_mode: host
    command: ["udp4", "--port", "8888", "-v6"]

  ros2:
    build: ./ros2
    container_name: rosa-ros2
    network_mode: host
    volumes:
      - ..:/workspace
    environment:
      - ROS_DOMAIN_ID=0
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    stdin_open: true
    tty: true
    command: bash

  microros_builder:
    build: ./microros_builder
    container_name: microros-builder
    volumes:
      - ..:/workspace
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    stdin_open: true
    tty: true
    command: bash
