# Run from the docker/ folder:  docker compose build   |   docker compose run --rm ros2
# The whole repo is mounted at /workspace in every container.
services:
  ros2:
    build: ./ros2
    container_name: rosa-ros2
    network_mode: host
    volumes:
      - ..:/workspace
    environment:
      - ROS_DOMAIN_ID=0
    stdin_open: true
    tty: true
    command: bash

  gazebo:
    build: ./gazebo
    container_name: gazebo-sim
    ports:
      # Browser desktop. 127.0.0.1 keeps it private to your computer.
      - "127.0.0.1:6080:6080"
    extra_hosts:
      # Lets ROSA reach Ollama running on your computer (macOS and Windows)
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/workspace
    environment:
      - DISPLAY=:1
      - ROS_DOMAIN_ID=0
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
    shm_size: "1gb"

  microros_builder:
    build: ./microros_builder
    container_name: microros-builder
    volumes:
      - ..:/workspace
    stdin_open: true
    tty: true
    command: bash
