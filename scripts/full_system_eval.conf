# Full-system evaluation configuration for scripts/launch_all.sh.
#
# Every software parameter used by the launch-all stack lives here, grouped by
# component, with the current launch defaults. Edit values in place for an
# evaluation run; launch_all.sh sources this file and passes each value to its
# launch file or environment. Values already set in the environment win (the
# defaults below only apply when the variable is unset), so a one-off override
# works without editing the file:
#
#   WEBMAP_PORT=9000 ./scripts/launch_all.sh
#
# Or pass a different config file:  ./scripts/launch_all.sh path/to/file.conf
#
# Notes:
#   - Wheel geometry (WHEEL_RADIUS, WHEEL_SEPARATION) must also match the
#     firmware config and dog_toy_finder_bringup config/robot.yaml.
#   - robot.yaml / ekf.yaml tuning stays in those YAML files; this file only
#     carries launch arguments and environment variables.
#   - ROS_DOMAIN_ID defaults to 0 in docker/docker-compose.yml.

# --- Bringup: dog_toy_finder_bringup robot.launch.py ---
USE_SIM_TIME=${USE_SIM_TIME:-false}
WHEEL_RADIUS=${WHEEL_RADIUS:-0.0325}
WHEEL_SEPARATION=${WHEEL_SEPARATION:-0.133}
PUBLISH_TF=${PUBLISH_TF:-false}
HEALTH_MONITOR=${HEALTH_MONITOR:-true}
# IMU mounting offset from base_link (metres for xyz, radians for angles).
IMU_X=${IMU_X:-0.0}
IMU_Y=${IMU_Y:-0.0}
IMU_Z=${IMU_Z:-0.0085}
IMU_ROLL=${IMU_ROLL:-0.0}
IMU_YAW=${IMU_YAW:-0.0}

# --- Health monitor: dog_toy_finder_diagnostics (via bringup) ---
HEALTH_CHECK_PERIOD=${HEALTH_CHECK_PERIOD:-0.5}
HEALTH_STARTUP_GRACE=${HEALTH_STARTUP_GRACE:-10.0}
HEALTH_IMU_TIMEOUT=${HEALTH_IMU_TIMEOUT:-0.5}
HEALTH_JOINT_STATES_TIMEOUT=${HEALTH_JOINT_STATES_TIMEOUT:-0.5}
HEALTH_IR_TIMEOUT=${HEALTH_IR_TIMEOUT:-1.0}
HEALTH_LEFT_CAMERA_TIMEOUT=${HEALTH_LEFT_CAMERA_TIMEOUT:-3.0}
HEALTH_RIGHT_CAMERA_TIMEOUT=${HEALTH_RIGHT_CAMERA_TIMEOUT:-3.0}
HEALTH_ODOMETRY_TIMEOUT=${HEALTH_ODOMETRY_TIMEOUT:-2.0}

# --- Stereo cameras: dog_toy_finder_vision stereo.launch.py ---
LEFT_URL=${LEFT_URL:-http://esp32cam-left.local/capture}
RIGHT_URL=${RIGHT_URL:-http://esp32cam-right.local/capture}
CAMERA_RATE=${CAMERA_RATE:-2.0}
IMAGE_WIDTH=${IMAGE_WIDTH:-640}
IMAGE_HEIGHT=${IMAGE_HEIGHT:-480}
CAMERA_FX=${CAMERA_FX:-500.0}
CAMERA_FY=${CAMERA_FY:-500.0}
CAMERA_CX=${CAMERA_CX:-320.0}
CAMERA_CY=${CAMERA_CY:-240.0}
STEREO_BASELINE=${STEREO_BASELINE:-0.08}

# --- Vision (VLM): dog_toy_finder_vision vision.launch.py ---
# VISION_MODELS is a comma-separated list to compare; when empty, the single
# VISION_MODEL is used.
VISION_MODEL=${VISION_MODEL:-gemma3}
VISION_MODELS=${VISION_MODELS:-}
VISION_OLLAMA_URL=${VISION_OLLAMA_URL:-http://localhost:11434}

# --- Mapping: dog_toy_finder_mapping mapping.launch.py ---
MAP_RESOLUTION=${MAP_RESOLUTION:-0.05}
MAP_WIDTH=${MAP_WIDTH:-200}
MAP_HEIGHT=${MAP_HEIGHT:-200}
MAP_ORIGIN_X=${MAP_ORIGIN_X:--5.0}
MAP_ORIGIN_Y=${MAP_ORIGIN_Y:--5.0}
OBSTACLE_RANGE=${OBSTACLE_RANGE:-0.25}
MAP_PUBLISH_PERIOD=${MAP_PUBLISH_PERIOD:-1.0}
IR_TOPIC=${IR_TOPIC:-/ir_obstacle/detected}
MAP_USE_VISION=${MAP_USE_VISION:-true}
VISION_OBSTACLE_RANGE=${VISION_OBSTACLE_RANGE:-0.8}
VISION_TIMEOUT=${VISION_TIMEOUT:-5.0}
TOY_FORWARD_DISTANCE=${TOY_FORWARD_DISTANCE:-0.6}
TOY_SIDE_OFFSET=${TOY_SIDE_OFFSET:-0.25}
TOY_MAX_DISTANCE=${TOY_MAX_DISTANCE:-5.0}
TOY_DEDUPE_RADIUS=${TOY_DEDUPE_RADIUS:-0.15}
TOY_OCCUPANCY_RADIUS=${TOY_OCCUPANCY_RADIUS:-1}

# --- Web map: dog_toy_finder_mapping map_webserver (port parameter) ---
WEBMAP_PORT=${WEBMAP_PORT:-8765}

# --- ROSA agent: rosa_agent (environment variables) ---
ROSA_MODEL=${ROSA_MODEL:-llama3.2}
ROSA_OLLAMA_URL=${ROSA_OLLAMA_URL:-http://localhost:11434}
ROSA_REQUIRE_APPROVAL=${ROSA_REQUIRE_APPROVAL:-1}
