# Full-system evaluation configuration for scripts/launch_all.sh.
#
# Every software parameter used by the launch-all stack and the evaluation
# commands lives here, grouped by component, with the current launch
# defaults. Edit values in place for an evaluation run; launch_all.sh sources
# this file and passes each value to its launch file or environment, and the
# evaluation commands in docs/setup/full_system_test.md expand the same
# variables. Values already set in the environment win (the defaults below
# only apply when the variable is unset), so a one-off override works without
# editing the file:
#
#   WEBMAP_PORT=9000 ./scripts/launch_all.sh
#
# Or pass a different config file:  ./scripts/launch_all.sh path/to/file.conf
#
# Notes:
#   - Wheel geometry (WHEEL_RADIUS, WHEEL_SEPARATION) must also match the
#     firmware config and dog_toy_finder_bringup config/robot.yaml. Those are
#     one-time hardware calibrations, not per-run settings.
#   - robot.yaml / ekf.yaml tuning stays in those YAML files; this file only
#     carries launch arguments and environment variables.
#   - ROS_DOMAIN_ID defaults to 0 in docker/docker-compose.yml.

# --- Bringup: dog_toy_finder_bringup robot.launch.py ---
USE_SIM_TIME=${USE_SIM_TIME:-false}
WHEEL_RADIUS=${WHEEL_RADIUS:-0.0325}
WHEEL_SEPARATION=${WHEEL_SEPARATION:-0.133}
PUBLISH_TF=${PUBLISH_TF:-false}
HEALTH_MONITOR=${HEALTH_MONITOR:-true}
# IMU mounting offset from base_link (metres for xyz, radians for angles).
IMU_X=${IMU_X:-0.0}
IMU_Y=${IMU_Y:-0.0}
IMU_Z=${IMU_Z:-0.0085}
IMU_ROLL=${IMU_ROLL:-0.0}
IMU_YAW=${IMU_YAW:-0.0}

# --- Command mux: dog_toy_finder_motion cmd_vel_mux (via bringup) ---
# cmd_vel_mux is the only publisher on the Pico's /cmd_vel topic. Manual
# commands (/cmd_vel_manual) win over autonomous commands (/cmd_vel_auto).
CMD_VEL_MUX=${CMD_VEL_MUX:-true}
CMD_VEL_MANUAL_TIMEOUT=${CMD_VEL_MANUAL_TIMEOUT:-0.5}
CMD_VEL_AUTO_TIMEOUT=${CMD_VEL_AUTO_TIMEOUT:-0.5}
CMD_VEL_RELEASE_TIMEOUT=${CMD_VEL_RELEASE_TIMEOUT:-0.5}
CMD_VEL_PUBLISH_RATE=${CMD_VEL_PUBLISH_RATE:-20.0}
# Non-zero commands are blocked when /odometry/filtered is older than this.
CMD_VEL_ODOMETRY_TIMEOUT=${CMD_VEL_ODOMETRY_TIMEOUT:-1.0}

# --- Health monitor: dog_toy_finder_diagnostics (via bringup) ---
HEALTH_CHECK_PERIOD=${HEALTH_CHECK_PERIOD:-0.5}
HEALTH_STARTUP_GRACE=${HEALTH_STARTUP_GRACE:-10.0}
HEALTH_IMU_TIMEOUT=${HEALTH_IMU_TIMEOUT:-0.5}
HEALTH_JOINT_STATES_TIMEOUT=${HEALTH_JOINT_STATES_TIMEOUT:-0.5}
HEALTH_IR_TIMEOUT=${HEALTH_IR_TIMEOUT:-1.0}
HEALTH_LEFT_CAMERA_TIMEOUT=${HEALTH_LEFT_CAMERA_TIMEOUT:-3.0}
HEALTH_RIGHT_CAMERA_TIMEOUT=${HEALTH_RIGHT_CAMERA_TIMEOUT:-3.0}
HEALTH_ODOMETRY_TIMEOUT=${HEALTH_ODOMETRY_TIMEOUT:-2.0}

# --- Stereo vision: dog_toy_finder_vision stereo_vision.launch.py ---
LEFT_URL=${LEFT_URL:-http://esp32cam-left.local/capture}
RIGHT_URL=${RIGHT_URL:-http://esp32cam-right.local/capture}
CAMERA_RATE=${CAMERA_RATE:-2.0}
# 320x240 keeps each rgb8 frame (~230 KB) small enough for reliable DDS
# delivery; at 640x480 the 900 KB colour frames are dropped often enough that
# image_proc logs "do not appear to be synchronized" and the point cloud stalls.
# Raise these together with the intrinsics (fx/fy/cx/cy) if your host can
# carry the larger frames.
IMAGE_WIDTH=${IMAGE_WIDTH:-320}
IMAGE_HEIGHT=${IMAGE_HEIGHT:-240}
CAMERA_FX=${CAMERA_FX:-250.0}
CAMERA_FY=${CAMERA_FY:-250.0}
CAMERA_CX=${CAMERA_CX:-160.0}
CAMERA_CY=${CAMERA_CY:-120.0}
STEREO_BASELINE=${STEREO_BASELINE:-0.08}

# --- Vision detectors: same stereo_vision.launch.py ---
# The classical detector and the ML prompt both read this YAML. Put the measured
# intrinsics, stereo baseline, toy size, valid depth range, HSV thresholds and
# algorithm limits there. The camera values should match CAMERA_* / STEREO_BASELINE
# above. Both paths consume /stereo/{left,right}/image_rect_color.
VISION_DETECTOR_CONFIG=${VISION_DETECTOR_CONFIG:-/workspace/software/ros2_ws/src/dog_toy_finder_vision/config/vision_detectors.yaml}
CLASSICAL_VISION_ENABLED=${CLASSICAL_VISION_ENABLED:-true}
ML_VISION_ENABLED=${ML_VISION_ENABLED:-true}

# --- Vision (ML/VLM): same stereo_vision.launch.py ---
# VISION_MODELS is a comma-separated list to compare; when empty, the single
# VISION_MODEL is used. Each listed model is loaded and unloaded in turn, so
# one model uses the Ollama host's VRAM at a time.
VISION_MODEL=${VISION_MODEL:-gemma4}
VISION_MODELS=${VISION_MODELS:-}
VISION_OLLAMA_URL=${VISION_OLLAMA_URL:-http://localhost:11434}

# --- Mapping: dog_toy_finder_mapping mapping.launch.py ---
MAP_RESOLUTION=${MAP_RESOLUTION:-0.05}
MAP_WIDTH=${MAP_WIDTH:-200}
MAP_HEIGHT=${MAP_HEIGHT:-200}
MAP_ORIGIN_X=${MAP_ORIGIN_X:--5.0}
MAP_ORIGIN_Y=${MAP_ORIGIN_Y:--5.0}
OBSTACLE_RANGE=${OBSTACLE_RANGE:-0.25}
MAP_PUBLISH_PERIOD=${MAP_PUBLISH_PERIOD:-1.0}
IR_TOPIC=${IR_TOPIC:-/ir_obstacle/detected}
MAP_USE_VISION=${MAP_USE_VISION:-true}
VISION_OBSTACLE_RANGE=${VISION_OBSTACLE_RANGE:-0.8}
VISION_TIMEOUT=${VISION_TIMEOUT:-5.0}
TOY_FORWARD_DISTANCE=${TOY_FORWARD_DISTANCE:-0.6}
# Deprecated: toy placement now uses lateral_bearing_deg, not a fixed side offset.
TOY_SIDE_OFFSET=${TOY_SIDE_OFFSET:-0.25}
TOY_MAX_DISTANCE=${TOY_MAX_DISTANCE:-5.0}
TOY_MERGE_RADIUS=${TOY_MERGE_RADIUS:-0.15}
TOY_OCCUPANCY_RADIUS=${TOY_OCCUPANCY_RADIUS:-1}

# --- Web map: dog_toy_finder_mapping map_webserver (port parameter) ---
WEBMAP_PORT=${WEBMAP_PORT:-8765}

# --- Manual keyboard drive: dog_toy_finder_motion manual_drive ---
# false keeps normal evaluation runs hands-off. Set true (or pass --manual to
# launch_all.sh) to add a 'manual' pane/window and select it: the robot drives
# and turns one axis at a time, and releasing the keys stops it.
MANUAL_DRIVE=${MANUAL_DRIVE:-false}
MANUAL_LINEAR_SPEED=${MANUAL_LINEAR_SPEED:-0.12}
MANUAL_ANGULAR_SPEED=${MANUAL_ANGULAR_SPEED:-0.5}
# Stop after this many seconds without a drive key (keyboard auto-repeat).
MANUAL_KEY_TIMEOUT=${MANUAL_KEY_TIMEOUT:-0.6}
MANUAL_PUBLISH_RATE=${MANUAL_PUBLISH_RATE:-20.0}

# --- ROSA agent: rosa_agent (environment variables) ---
ROSA_MODEL=${ROSA_MODEL:-llama3.2}
ROSA_OLLAMA_URL=${ROSA_OLLAMA_URL:-http://localhost:11434}
ROSA_REQUIRE_APPROVAL=${ROSA_REQUIRE_APPROVAL:-1}

# --- LLM comparison trials ---
# Set LLM_TRIALS=true to add the vision trial collector pane/window. It records
# one row per model for every /vision/ask (fill VISION_MODELS to compare more
# than one). ROSA always receives --output-csv so each planning prompt is
# appended to the same schema, including the tools the model called.
#
# Trial data lives in the repository's data/ folder, next to hardware/ and
# software/. The ROS 2 container mounts the repo at /workspace, so the launcher
# and evaluation commands use /workspace/data; on the host the same files are
# under <repo>/data.
LLM_TRIALS=${LLM_TRIALS:-false}
DATA_DIR=${DATA_DIR:-/workspace/data}
VISION_TRIAL_DIR=${VISION_TRIAL_DIR:-$DATA_DIR/vision}
PLANNING_TRIAL_DIR=${PLANNING_TRIAL_DIR:-$DATA_DIR/planning}
VISION_TRIAL_RUN_ID=${VISION_TRIAL_RUN_ID:-vision1}
# Metres allowed between the VLM distance estimate and the ground truth.
LLM_TRIAL_DISTANCE_TOLERANCE=${LLM_TRIAL_DISTANCE_TOLERANCE:-0.25}
# Degrees allowed between the VLM lateral bearing estimate and the operator's
# measured bearing (positive = robot-left).
LLM_TRIAL_BEARING_TOLERANCE=${LLM_TRIAL_BEARING_TOLERANCE:-5.0}
# Confidence level for post-collection statistical intervals (0 < level < 1).
LLM_TRIAL_CONFIDENCE=${LLM_TRIAL_CONFIDENCE:-0.95}
ROSA_RUN_ID=${ROSA_RUN_ID:-plan1}
VISION_ANALYSIS_JSON=${VISION_ANALYSIS_JSON:-$VISION_TRIAL_DIR/$VISION_TRIAL_RUN_ID/vision_analysis.json}
PLANNING_ANALYSIS_JSON=${PLANNING_ANALYSIS_JSON:-$PLANNING_TRIAL_DIR/$ROSA_RUN_ID/planning_analysis.json}
ROSA_OUTPUT_CSV=${ROSA_OUTPUT_CSV:-$PLANNING_TRIAL_DIR/$ROSA_RUN_ID/planning_trials.csv}
# Optional JSON with planning ground truth. A flat object applies to every
# model; see software/rosa_agent/README.md for the per-model/prompt form.
ROSA_GT_JSON=${ROSA_GT_JSON:-}

# --- Capture-first vision comparison ---
# Capture rectified left+right JPEGs with operator-entered ground truth using
# vision_capture, then replay every saved capture offline with vision_eval.
# Captures are gitignored and live under data/vision/captures by default.
VISION_CAPTURE_DIR=${VISION_CAPTURE_DIR:-$DATA_DIR/vision/captures}
VISION_CAPTURE_TIMEOUT=${VISION_CAPTURE_TIMEOUT:-20.0}
VISION_CAPTURE_RUN_ID=${VISION_CAPTURE_RUN_ID:-capture_run1}
VISION_CAPTURE_TARGET=${VISION_CAPTURE_TARGET:-red ball}
# Defaults for the batch evaluator (source this file, then run vision_eval).
VISION_EVAL_MODELS=${VISION_EVAL_MODELS:-${VISION_MODELS:-$VISION_MODEL}}
VISION_EVAL_TOLERANCE=${VISION_EVAL_TOLERANCE:-$LLM_TRIAL_DISTANCE_TOLERANCE}
VISION_EVAL_BEARING_TOLERANCE=${VISION_EVAL_BEARING_TOLERANCE:-$LLM_TRIAL_BEARING_TOLERANCE}
VISION_EVAL_CSV=${VISION_EVAL_CSV:-$DATA_DIR/vision/vision_eval_trials.csv}
VISION_EVAL_JSONL=${VISION_EVAL_JSONL:-$DATA_DIR/vision/vision_eval_results.jsonl}
VISION_EVAL_SUMMARY_JSON=${VISION_EVAL_SUMMARY_JSON:-$DATA_DIR/vision/vision_eval_summary.json}
VISION_EVAL_ANALYSIS_JSON=${VISION_EVAL_ANALYSIS_JSON:-$DATA_DIR/vision/vision_eval_analysis.json}

# --- Evaluation runs ---
# The launch-all stack above is started by launch_all.sh. The evaluation
# commands below are run manually (see docs/setup/full_system_test.md
# sections 5.1-5.4); source this file first and the variables expand to
# these values:
#   source scripts/full_system_eval.conf
#   ros2 launch dog_toy_finder_planning autonomous_search.launch.py \
#       target:="$AUTO_TARGET" side:=$AUTO_SIDE loops:=$AUTO_LOOPS \
#       max_time:=$AUTO_MAX_TIME output_csv:=$AUTO_OUTPUT_CSV \
#       run_id:=$AUTO_RUN_ID
#   cd software/rosa_agent && python3 -m rosa_agent --compare "$ROSA_COMPARE" \
#       --prompt "$ROSA_PROMPT" --output-csv "$ROSA_OUTPUT_CSV" \
#       --run-id "$ROSA_RUN_ID"
#   ros2 run dog_toy_finder_data llm_trials score "$ROSA_OUTPUT_CSV"
#   ros2 run dog_toy_finder_data llm_trials analyze "$ROSA_OUTPUT_CSV" \
#       --confidence "$LLM_TRIAL_CONFIDENCE" --output "$PLANNING_ANALYSIS_JSON"
#   ros2 run dog_toy_finder_vision vision_eval \
#       --captures-dir "$VISION_CAPTURE_DIR" --models "$VISION_EVAL_MODELS" \
#       --tolerance "$VISION_EVAL_TOLERANCE" \
#       --bearing-tolerance "$VISION_EVAL_BEARING_TOLERANCE" \
#       --output-csv "$VISION_EVAL_CSV" --results-json "$VISION_EVAL_JSONL" \
#       --summary-json "$VISION_EVAL_SUMMARY_JSON"
#   ros2 run dog_toy_finder_data llm_trials analyze "$VISION_EVAL_CSV" \
#       --tolerance "$VISION_EVAL_TOLERANCE" \
#       --bearing-tolerance "$VISION_EVAL_BEARING_TOLERANCE" \
#       --confidence "$LLM_TRIAL_CONFIDENCE" \
#       --output "$VISION_EVAL_ANALYSIS_JSON"

# Shared evaluation target: the toy (or comma-separated list of toys, e.g.
# "red ball,blue bone") to search for. A list searches several toy kinds;
# a single name searches every instance of that one kind.
EVAL_TARGET=${EVAL_TARGET:-red ball}
# ROSA model comparison (section 5.1): comma-separated models and the prompt.
# Each model is loaded and unloaded in turn, so one planner uses the Ollama
# host's VRAM at a time.
ROSA_COMPARE=${ROSA_COMPARE:-llama3.2,mistral,qwen2.5}
ROSA_PROMPT=${ROSA_PROMPT:-Find the red ball.}

# Autonomous planner: dog_toy_finder_planning autonomous_search.launch.py
AUTO_TARGET=${AUTO_TARGET:-$EVAL_TARGET}
AUTO_SIDE=${AUTO_SIDE:-0.5}
AUTO_SIDE_INCREMENT=${AUTO_SIDE_INCREMENT:-0.5}
AUTO_LOOPS=${AUTO_LOOPS:-3}
AUTO_MAX_TIME=${AUTO_MAX_TIME:-120.0}
AUTO_OUTPUT_CSV=${AUTO_OUTPUT_CSV:-/tmp/autonomous_search.csv}
AUTO_RUN_ID=${AUTO_RUN_ID:-auto1}
# Stop when the VLM sees the toy medium/large, or estimates it within
# this many metres.
AUTO_FOUND_DISTANCE=${AUTO_FOUND_DISTANCE:-0.4}
# Demo mode: record each new toy and keep searching until coverage ends,
# instead of stopping at the first toy. AUTO_ESCAPE_DISTANCE is how far the
# robot backs up after each find before sweeping again.
AUTO_FIND_ALL=${AUTO_FIND_ALL:-false}
# Deprecated: kept for old launch invocations; bearing-based placement is used.
AUTO_TOY_SIDE_OFFSET=${AUTO_TOY_SIDE_OFFSET:-0.25}
AUTO_TOY_FORWARD_DISTANCE=${AUTO_TOY_FORWARD_DISTANCE:-0.6}
AUTO_TOY_MERGE_RADIUS=${AUTO_TOY_MERGE_RADIUS:-0.15}
AUTO_ESCAPE_DISTANCE=${AUTO_ESCAPE_DISTANCE:-0.3}

# Toy-search harness: dog_toy_finder_experiments toy_search.launch.py
TOY_TARGET=${TOY_TARGET:-$EVAL_TARGET}
TOY_PATTERN=${TOY_PATTERN:-square}
TOY_SIDE=${TOY_SIDE:-0.5}
TOY_SIDE_INCREMENT=${TOY_SIDE_INCREMENT:-0.5}
TOY_LOOPS=${TOY_LOOPS:-3}
TOY_MAX_TIME=${TOY_MAX_TIME:-120.0}
TOY_OUTPUT_CSV=${TOY_OUTPUT_CSV:-/tmp/toy_search.csv}
TOY_RUN_ID=${TOY_RUN_ID:-run1}
TOY_FOUND_DISTANCE=${TOY_FOUND_DISTANCE:-0.4}
TOY_FIND_ALL=${TOY_FIND_ALL:-false}
# Deprecated: kept for old launch invocations; bearing-based placement is used.
TOY_TOY_SIDE_OFFSET=${TOY_TOY_SIDE_OFFSET:-0.25}
TOY_TOY_FORWARD_DISTANCE=${TOY_TOY_FORWARD_DISTANCE:-0.6}
TOY_TOY_MERGE_RADIUS=${TOY_TOY_MERGE_RADIUS:-0.15}
TOY_ESCAPE_DISTANCE=${TOY_ESCAPE_DISTANCE:-0.3}

# Data collection: dog_toy_finder_data collect.launch.py
COLLECT_OUTPUT_DIR=${COLLECT_OUTPUT_DIR:-/tmp/dog_toy_dataset}
COLLECT_RUN_ID=${COLLECT_RUN_ID:-run1}
COLLECT_RECORD_IMAGES=${COLLECT_RECORD_IMAGES:-true}
COLLECT_IMAGE_EVERY=${COLLECT_IMAGE_EVERY:-5}
COLLECT_RECORD_DISPARITY=${COLLECT_RECORD_DISPARITY:-false}

# --- Launcher UI: konsole (split panes) vs tmux (default auto) ---
KONSOLE=${KONSOLE:-auto}
